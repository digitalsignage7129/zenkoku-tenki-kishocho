<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>WEATHER BOARD FLEX</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Hiragino Kaku Gothic StdN", "Meiryo", Arial, sans-serif;
            font-weight: bold;
            padding: 25px;
            overflow: hidden;
            height: 100vh;
        }
        
        /* ヘッダー：左右のメリハリを強化 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end; /* 下揃えにしてどっしり感を出す */
            border-bottom: 6px solid #ffffff;
            padding-bottom: 15px;
            margin-bottom: 35px;
        }
        
        /* 左側：日付と地域 */
        .header-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .date { font-size: 55px; font-family: monospace; color: #aaaaaa; }
        .name { font-size: 70px; color: #ffffff; font-weight: 900; line-height: 1.1; }

        /* 右側：現在気温を圧倒的に目立たせる */
        .header-right {
            text-align: right;
            display: flex;
            align-items: baseline; /* 単位と数字の底辺を合わせる */
            gap: 15px;
        }
        .temp-area { font-size: 35px; color: #ffffff; background: #333333; padding: 4px 12px; border-radius: 8px; }
        .temp-display { font-size: 110px; color: #00ffcc; font-family: 'Arial Black', sans-serif; line-height: 0.9; }

        /* 3時間ごとの横並びコンテナ */
        .timeline-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            height: calc(100vh - 230px); /* ヘッダーが大きくなった分を調整 */
        }
        .time-box {
            flex: 1;
            background: #000000;
            border: 4px solid #ffffff;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 25px 10px;
        }
        .time-label { font-size: 40px; color: #ffff00; font-family: monospace; }
        .time-icon { font-size: 100px; line-height: 1; }
        .time-temp { font-size: 50px; color: #ffffff; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <span class="date">6/1</span>
            <span class="name" id="backName">青森</span>
        </div>
        <div class="header-right">
            <span class="temp-area">現在気温</span>
            <span class="temp-display">26.5°C</span>
        </div>
    </div>

    <div class="timeline-container">
        <div class="time-box">
            <span class="time-label">15:00</span>
            <span class="time-icon">☀</span>
            <span class="time-temp">24°C</span>
        </div>
        <div class="time-box">
            <span class="time-label">18:00</span>
            <span class="time-icon">☁</span>
            <span class="time-temp">21°C</span>
        </div>
        <div class="time-box">
            <span class="time-label">21:00</span>
            <span class="time-icon">☔</span>
            <span class="time-temp">18°C</span>
        </div>
        <div class="time-box">
            <span class="time-label">00:00</span>
            <span class="time-icon">☁</span>
            <span class="time-temp">16°C</span>
        </div>
    </div>

</body>
</html>
