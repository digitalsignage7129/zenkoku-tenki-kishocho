<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>WEATHER BOARD GRID</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Hiragino Kaku Gothic StdN", "Meiryo", Arial, sans-serif;
            font-weight: bold;
            padding: 25px;
            overflow: hidden;
            height: 100vh;
        }
        
        /* 固定ヘッダー（現在気温を爆大化） */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 6px solid #ffffff;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .header-left { display: flex; flex-direction: column; gap: 5px; }
        .date { font-size: 55px; font-family: monospace; color: #aaaaaa; }
        .name { font-size: 70px; color: #ffffff; font-weight: 900; line-height: 1.1; }

        .header-right { display: flex; align-items: baseline; gap: 15px; }
        .temp-area { font-size: 35px; color: #ffffff; background: #333333; padding: 4px 12px; border-radius: 8px; }
        .temp-display { font-size: 110px; color: #00ffcc; font-family: 'Arial Black', sans-serif; line-height: 0.9; }

        /* 画像のような「主要部カード」を並べるグリッドコンテナ */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 横に4枚並べる（地域数に合わせて自動調整可） */
            gap: 20px;
            height: calc(100vh - 230px);
        }

        /* 1つ1つの主要部カードデザイン（ご提示の画像イメージを再現） */
        .area-card {
            background: #111111;
            border: 4px solid #ffffff;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 10px;
        }

        .card-name {
            font-size: 45px;
            color: #ffffff;
            font-weight: 900;
            border-bottom: 3px solid #555555;
            width: 90%;
            text-align: center;
            padding-bottom: 5px;
        }

        /* 天気アイコン部分（背景をツートンにするなどしてデザイン性をアップ予定） */
        .card-weather {
            font-size: 100px;
            line-height: 1;
            margin: 10px 0;
        }

        /* 気温（最高/最低）の横並び */
        .card-temps {
            display: flex;
            gap: 15px;
            font-size: 35px;
            font-family: monospace;
        }
        .temp-max { color: #ff4444; } /* 最高気温は赤 */
        .temp-min { color: #4488ff; } /* 最低気温は青 */

        /* 降水確率 */
        .card-pop {
            font-size: 45px;
            color: #ffff00; /* 黄色で目立たせる */
            font-family: "Impact", sans-serif;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <span class="date">6/1</span>
            <span class="name" id="backName">東京都</span>
        </div>
        <div class="header-right">
            <span class="temp-area">現在気温</span>
            <span class="temp-display">26.5°C</span>
        </div>
    </div>

    <div class="grid-container">
        
        <div class="area-card">
            <span class="card-name">東京</span>
            <span class="card-weather">☀</span>
            <div class="card-temps">
                <span class="temp-max">31</span>/<span class="temp-min">20</span>
            </div>
            <span class="card-pop">20%</span>
        </div>

        <div class="area-card">
            <span class="card-name">大島</span>
            <span class="card-weather">☁</span>
            <div class="card-temps">
                <span class="temp-max">28</span>/<span class="temp-min">21</span>
            </div>
            <span class="card-pop">30%</span>
        </div>

        <div class="area-card">
            <span class="card-name">八丈島</span>
            <span class="card-weather">☔</span>
            <div class="card-temps">
                <span class="temp-max">26</span>/<span class="temp-min">22</span>
            </div>
            <span class="card-pop">70%</span>
        </div>

        <div class="area-card">
            <span class="card-name">父島</span>
            <span class="card-weather">☀</span>
            <div class="card-temps">
                <span class="temp-max">30</span>/<span class="temp-min">24</span>
            </div>
            <span class="card-pop">10%</span>
        </div>

    </div>

</body>
</html>
