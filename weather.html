<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>WEATHER MAP SIGNAGE PERFECT</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Hiragino Kaku Gothic StdN", "Meiryo", Arial, sans-serif;
            font-weight: bold;
            padding: 25px;
            overflow: hidden;
            height: 100vh;
        }
        
        /* 固定ヘッダー */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 6px solid #ffffff;
            padding-bottom: 15px;
            position: relative;
            z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .date { font-size: 55px; font-family: monospace; color: #aaaaaa; }
        
        /* 【新設】都道府県選択ボックス（サイネージの邪魔をしないシンプルなデザイン） */
        .pref-selector {
            font-size: 45px;
            font-weight: 900;
            background-color: #222222;
            color: #ffffff;
            border: 3px solid #ffffff;
            border-radius: 10px;
            padding: 5px 15px;
            cursor: pointer;
        }

        .header-right { display: flex; align-items: baseline; gap: 15px; }
        .temp-area { font-size: 35px; color: #ffffff; background: #333333; padding: 4px 12px; border-radius: 8px; }
        .temp-display { font-size: 110px; color: #00ffcc; font-family: 'Arial Black', sans-serif; line-height: 0.9; margin-left: 15px; }

        /* 地図表示エリア */
        .map-viewport {
            position: relative;
            width: 100%;
            height: calc(100vh - 200px);
            margin-top: 20px;
            background: #000000;
            border-radius: 20px;
            overflow: hidden;
        }

        #map-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .pref-path {
            fill: #112611;
            stroke: #224422;
            stroke-width: 1.5px;
        }

        /* 予報カード */
        .pin-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 5;
            pointer-events: none;
        }
        .map-pin-card {
            position: absolute;
            background: rgba(10, 10, 10, 0.92);
            border: 4px solid #ffffff;
            border-radius: 12px;
            width: 210px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            transform: translate(-50%, -50%);
        }
        .pin-name {
            font-size: 32px;
            color: #ffffff;
            border-bottom: 2px solid #555555;
            width: 100%;
            text-align: center;
            padding-bottom: 2px;
            background: #222222;
            border-radius: 6px 6px 0 0;
        }
        .pin-weather { font-size: 75px; line-height: 1; margin: 5px 0; }
        .pin-temps { font-size: 28px; font-family: monospace; }
        .max { color: #ff4444; }
        .min { color: #4488ff; }
        .pin-pop { font-size: 35px; color: #ffff00; font-family: "Impact", sans-serif; margin-top: 2px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <span class="date" id="dateText">--/--</span>
            <select class="pref-selector" id="prefSelect" onchange="changePrefecture()">
                <option value="130000,44132">東京都</option>
                <option value="020000,31151">青森県</option>
                <option value="270000,62078">大阪府</option>
                <option value="016000,14163">北海道（札幌）</option>
                <option value="140000,46106">神奈川県</option>
                <option value="230000,51106">愛知県</option>
                <option value="400000,82182">福岡県</option>
                <option value="471000,91197">沖縄県（那覇）</option>
            </select>
        </div>
        <div class="header-right">
            <span class="temp-area">現在気温</span>
            <span class="temp-display" id="liveTemp">--.-°C</span>
        </div>
    </div>

    <div class="map-viewport">
        <svg id="map-svg"></svg>
        <div class="pin-container" id="pin-container"></div>
    </div>

    <script>
        // URLパラメータがあれば初期値にする。なければ東京
        const params = new URLSearchParams(window.location.search);
        let currentArea = params.get('area') || '130000';
        let currentAmedas = params.get('amedas') || '44132';

        // セレクトボックスの初期選択状態を合わせる
        const selectEl = document.getElementById('prefSelect');
        selectEl.value = `${currentArea},${currentAmedas}`;

        // 画面で県が選ばれたら、変数を書き換えてシステムを再起動する関数
        function changePrefecture() {
            const [area, amedas] = selectEl.value.split(',');
            currentArea = area;
            currentAmedas = amedas;
            initSystem(); // 再読み込み
        }

        function getWeatherEmoji(code) {
            const c = parseInt(code);
            if (c >= 100 && c < 200) return '☀';
            if (c >= 200 && c < 300) return '☁';
            if (c >= 300 && c < 400) return '☔';
            return '☁';
        }

        async function drawWeatherMap(prefJis) {
            const width = document.getElementById('map-svg').clientWidth;
            const height = document.getElementById('map-svg').clientHeight;
            const svg = d3.select("#map-svg");
            svg.selectAll("*").remove();

            try {
                const response = await fetch("https://raw.githubusercontent.com/codeforjapan/japan-geojson/master/topojson/prefectures.json");
                const topoData = await response.json();
                const geoData = topojson.feature(topoData, topoData.objects.prefectures);

                const targetPref = geoData.features.find(f => parseInt(f.properties.code) === prefJis);
                if (!targetPref) return;

                const projection = d3.geoMercator().fitSize([width, height], targetPref);
                const pathGenerator = d3.geoPath().projection(projection);

                svg.append("path").datum(targetPref).attr("class", "pref-path").attr("d", pathGenerator);

                const fRes = await fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${currentArea}.json`);
                const forecastData = await fRes.json();

                const pinContainer = document.getElementById('pin-container');
                pinContainer.innerHTML = '';

                const areas = forecastData[0].timeSeries[0].areas;
                const pops = forecastData[0].timeSeries[1] ? forecastData[0].timeSeries[1].areas : [];
                const temps = forecastData[0].timeSeries
