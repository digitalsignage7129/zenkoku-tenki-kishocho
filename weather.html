<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>WEATHER BOARD STANDARD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Hiragino Kaku Gothic StdN", "Meiryo", Arial, sans-serif;
            font-weight: bold;
            padding: 25px;
            overflow: hidden;
            position: relative;
            height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 5px solid #ffffff;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .title-group { display: flex; gap: 30px; align-items: baseline; }
        .date { font-size: 50px; font-family: monospace; }
        .name { font-size: 55px; color: #ffffff; }
        .temp-area { font-size: 30px; color: #aaaaaa; }
        .temp-display { font-size: 70px; color: #00ffcc; font-family: 'Arial Black', sans-serif; margin-left: 10px; }

        .forecast-grid {
            display: flex;
            gap: 25px;
            height: calc(100vh - 170px);
        }
        .day-card {
            flex: 1;
            background: #000000;
            border: 4px solid #ffffff;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 30px 10px;
        }
        .card-label { font-size: 45px; color: #ffffff; font-weight: 900; }
        .card-icon { font-size: 140px; line-height: 1; }
        .card-pop { font-size: 85px; color: #ffff00; font-family: "Impact", sans-serif; }
        
        .credit {
            position: absolute;
            bottom: 5px;
            right: 20px;
            font-size: 12px;
            color: #444444;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-group">
            <span class="date" id="dateText">--/--</span>
            <span class="name" id="backName">--</span>
        </div>
        <div>
            <span class="temp-area">現在気温<span class="temp-display" id="liveTemp">--.-</span></span>
        </div>
    </div>

    <div class="forecast-grid">
        <div class="day-card">
            <span class="card-label">今日</span>
            <span class="card-icon" id="iconToday">・</span>
            <span class="card-pop" id="popToday">--</span>
        </div>
        <div class="day-card">
            <span class="card-label">明日</span>
            <span class="card-icon" id="iconTom">・</span>
            <span class="card-pop" id="popTom">--</span>
        </div>
        <div class="day-card">
            <span class="card-label">明後日</span>
            <span class="card-icon" id="iconAftTom">・</span>
            <span class="card-pop" id="popAftTom">--</span>
        </div>
    </div>

    <div class="credit">データ元: 気象庁</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const areaCode = params.get('area') || '130000';
        const amedasCode = params.get('amedas') || '44132';
        const areaName = params.get('name') || '東京';

        document.getElementById('backName').innerText = areaName;

        function getWeatherEmoji(code) {
            const c = parseInt(code);
            if (c >= 100 && c < 200) return '☀';
            if (c >= 200 && c < 300) return '☁';
            if (c >= 300 && c < 400) return '☔';
            return '☁';
        }

        async function initSystem() {
            const now = new Date();
            document.getElementById('dateText').innerText = `${now.getMonth()+1}/${now.getDate()}`;

            // 1. 府県天気予報データの取得
            try {
                const res = await fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${areaCode}.json`);
                const data = await res.json();
                
                const fSeries = data[0].timeSeries[0].areas[0];
                document.getElementById('iconToday').innerText = getWeatherEmoji(fSeries.weatherCodes[0]);
                document.getElementById('iconTom').innerText = getWeatherEmoji(fSeries.weatherCodes[1]);

                const popSeries = data[0].timeSeries[1].areas[0];
                // データの安全な取り出し
                document.getElementById('popToday').innerText = popSeries.pops[0] || '0';
                document.getElementById('popTom').innerText = popSeries.pops[popSeries.pops.length - 1] || '0';

                // 明後日（3日目データエラー対策処理）
                try {
                    const weekSeries = data[1].timeSeries[0].areas[0];
                    document.getElementById('iconAftTom').innerText = getWeatherEmoji(weekSeries.weatherCodes[1]);
                    document.getElementById('popAftTom').innerText = data[1].timeSeries[1].areas[0].pops[1] || '0';
                } catch(e) {
                    document.getElementById('iconAftTom').innerText = getWeatherEmoji(fSeries.weatherCodes[2] || '200');
                    document.getElementById('popAftTom').innerText = '0';
                }
            } catch(e) { console.error("Forecast API Error", e); }

            // 2. アメダス現在気温データの取得（遡りサーチ機能付き）
            try {
                const tRes = await fetch(`https://www.jma.go.jp/bosai/amedas/data/latest_time.txt`);
                const lTime = (await tRes.text()).trim();
                
                const year = lTime.substring(0, 4);
                const month = lTime.substring(4, 6);
                const day = lTime.substring(6, 8);
                const hour = lTime.substring(8, 10);

                const amedasRes = await fetch(`https://www.jma.go.jp/bosai/amedas/data/point/${amedasCode}/${year}${month}${day}_${hour}.json`);
                const amedasData = await amedasRes.json();
                
                let tKey = `${lTime}00`;
                let targetData = amedasData[tKey];

                if(!targetData || !targetData.temp) {
                    const baseMin = parseInt(lTime.substring(10, 12));
                    for (let i = 10; i <= 30; i += 10) {
                        let m = baseMin - i;
                        let h = parseInt(hour);
                        if(m < 0) { m += 60; h = (h - 1 + 24) % 24; }
                        let altKey = `${year}${month}${day}${String(h).padStart(2,'0')}${String(m).padStart(2,'0')}00`;
                        if(amedasData[altKey] && amedasData[altKey].temp) {
                            targetData = amedasData[altKey];
                            break;
                        }
                    }
                }

                if(targetData && targetData.temp) {
                    document.getElementById('liveTemp').innerText = targetData.temp[0].toFixed(1);
                }
            } catch(e) { console.error("Amedas API Error", e); }
        }

        initSystem();
        setInterval(initSystem, 600000); // 10分ごとに再ロード
    </script>
</body>
</html>
