<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>WEATHER MAP SIGNAGE TV-STYLE FINAL SENSATIONAL</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Hiragino Kaku Gothic StdN", "Meiryo", Arial, sans-serif;
            font-weight: bold;
            padding: 25px;
            overflow: hidden;
            height: 100vh;
        }
        
        /* 固定ヘッダー */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 6px solid #ffffff;
            padding-bottom: 15px;
            height: 140px;
            position: relative;
            z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .date { font-size: 55px; font-family: monospace; color: #aaaaaa; }
        
        .pref-selector {
            font-size: 40px;
            font-weight: 900;
            background-color: #333333;
            color: #ffffff;
            border: 3px solid #ffffff;
            border-radius: 10px;
            padding: 5px 15px;
            cursor: pointer;
        }
        .pref-selector option {
            background-color: #333333;
            color: #ffffff;
        }

        .header-right { display: flex; align-items: baseline; gap: 15px; }
        .temp-area { font-size: 35px; color: #ffffff; background: #333333; padding: 4px 12px; border-radius: 8px; }
        .temp-display { font-size: 110px; color: #00ffcc; font-family: 'Arial Black', sans-serif; line-height: 0.9; }

        /* 地図表示ビューポート */
        .map-viewport {
            position: relative;
            width: 100%;
            height: calc(100vh - 190px);
            margin-top: 20px;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #333333;
            background: #0e2442; /* テレビの天気予報風の深い海の青 */
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #0e2442 !important;
        }

        /* 予報カード：1枚目のテレビ画面デザインを完璧にトレース */
        .leaflet-marker-icon { background: none; border: none; }
        .map-pin-card {
            background: #ffffff;
            border: 3px solid #b5b5b5;
            border-radius: 14px;
            width: 160px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: center;
        }
        .pin-name {
            font-size: 26px;
            color: #111111;
            width: 100%;
            text-align: center;
            padding: 1px 0;
            font-weight: 900;
        }
        /* 1枚目そっくりの、天気に合わせた背景カラーボックス */
        .weather-box {
            width: 100%;
            color: #ffffff;
            border-radius: 6px;
            text-align: center;
            font-size: 60px;
            line-height: 1.1;
            margin: 2px 0;
        }
        .bg-sunny { background: #ff7700; }  /* 晴れ：オレンジ */
        .bg-cloudy { background: #888888; } /* 曇り：グレー */
        .bg-rainy { background: #0066cc; }  /* 雨：クッキリ青 */

        .pin-temps { font-size: 26px; font-family: "Arial", sans-serif; font-weight: 900; margin-top: 2px; color: #333333; }
        .max { color: #ff2222; }
        .min { color: #1177ff; }
        .pin-pop { font-size: 28px; color: #111111; font-weight: 900; margin-top: 1px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <span class="date" id="dateText">--/--</span>
            <select class="pref-selector" id="prefSelect" onchange="changePrefecture()">
                <option value="130000,44132,35.6895,139.6917,10">東京都</option>
                <option value="270000,62078,34.6863,135.5200,10">大阪府</option>
                <option value="020000,31151,40.8244,140.7471,9">青森県</option>
                <option value="016000,14163,43.0642,141.3468,9">北海道</option>
                <option value="040000,34392,38.2682,140.8694,9">宮城県</option>
                <option value="110000,43056,35.8570,139.6489,10">埼玉県</option>
                <option value="120000,45212,35.6051,140.1233,10">千葉県</option>
                <option value="140000,46106,35.4478,139.6425,10">神奈川県</option>
                <option value="230000,51106,35.1803,136.9067,10">愛知県</option>
                <option value="260000,61236,35.0210,135.7556,10">京都府</option>
                <option value="280000,63411,34.6913,135.1830,10">兵庫県</option>
                <option value="340000,67416,34.3966,132.4596,10">広島県</option>
                <option value="400000,82182,33.6064,130.4181,10">福岡県</option>
                <option value="471000,91197,26.2125,127.6809,10">沖縄県</option>
            </select>
        </div>
        <div class="header-right">
            <span class="temp-area">現在気温</span>
            <span class="temp-display" id="liveTemp">--.-°C</span>
        </div>
    </div>

    <div class="map-viewport">
        <div id="map"></div>
    </div>

    <script>
        let map;
        let geoJsonLayer;
        const params = new URLSearchParams(window.location.search);
        let currentArea = params.get('area') || '130000';
        let currentAmedas = params.get('amedas') || '44132';

        const regionalCoordinates = {
            "130000": [{ name: "東京", lat: 35.66, lon: 139.75 }, { name: "大島", lat: 34.75, lon: 139.36 }, { name: "八丈島", lat: 33.11, lon: 139.79 }],
            "270000": [{ name: "大阪", lat: 34.69, lon: 135.50 }, { name: "堺", lat: 34.54, lon: 135.48 }],
            "020000": [{ name: "青森", lat: 40.82, lon: 140.75 }, { name: "むつ", lat: 41.29, lon: 141.21 }, { name: "八戸", lat: 40.51, lon: 141.48 }],
            "016000": [{ name: "札幌", lat: 43.06, lon: 141.35 }, { name: "旭川", lat: 43.77, lon: 142.35 }],
            "140000": [{ name: "横浜", lat: 35.44, lon: 139.64 }, { name: "小田原", lat: 35.25, lon: 139.15 }],
            "230000": [{ name: "名古屋", lat: 35.18, lon: 136.90 }],
            "400000": [{ name: "福岡", lat: 33.60, lon: 130.41 }, { name: "北九州", lat: 33.88, lon: 130.88 }],
            "471000": [{ name: "那覇", lat: 26.21, lon: 127.68 }]
        };

        const selectEl = document.getElementById('prefSelect');
        for (let option of selectEl.options) {
            if (option.value.startsWith(currentArea)) { selectEl.value = option.value; break; }
        }

        function changePrefecture() {
            const val = selectEl.value.split(',');
            currentArea = val[0]; currentAmedas = val[1];
            const lat = parseFloat(val[2]); const lon = parseFloat(val[3]); const zoom = parseInt(val[4]);
            map.setView([lat, lon], zoom);
            initSystem();
        }

        function getWeatherStyles(code) {
            const c = parseInt(code);
            if (c >= 100 && c < 200) return { emoji: '☀', class: 'bg-sunny' };
            if (c >= 200 && c < 300) return { emoji: '☁', class: 'bg-cloudy' };
            if (c >= 300 && c < 400) return { emoji: '☔', class: 'bg-rainy' };
            return { emoji: '☁', class: 'bg-cloudy' };
        }

        // 国土地理院の純粋な「県境データ」をダウンロードして一発で地上波お天気色に塗り分ける関数
        async function loadTvStyleGeoJson() {
            if (geoJsonLayer) map.removeLayer(geoJsonLayer);
            try {
                // 国土数値情報の軽量高精度な日本地図JSONを読み込み
                const response = await fetch('https://raw.githubusercontent.com/mizutani/japan-geojson/master/japan.geojson');
                const geoData = await response.json();

                // 【ここが心臓部】文字も線もない白地図を、テレビ風の「明るい萌黄色（黄緑）」と「白い境界線」で直に着色
                geoJsonLayer = L.geoJson(geoData, {
                    style: function(feature) {
                        return {
                            fillColor: '#8ae639', // 地上波お天気マップの鮮烈な黄緑
                            fillOpacity: 0.95,
                            color: '#ffffff',     // クッキリとした白い県境
                            weight: 3
                        };
                    }
                }).addTo(map);
            } catch(e) { console.error("地図データの取得に失敗しました:", e); }
        }

        function initMap() {
            const val = selectEl.value.split(',');
            const lat = parseFloat(val[2]); const lon = parseFloat(val[3]); const zoom = parseInt(val[4]);

            // タイルを一切読み込まず、ただの青いキャンバスとして地図空間を作る（余計な文字を100%排除）
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([lat, lon], zoom);
            loadTvStyleGeoJson();
        }

        async function initSystem() {
            const now = new Date();
            document.getElementById('dateText').innerText = `${now.getMonth()+1}/${now.getDate()}`;

            // カードのみを再配置
            try {
                map.eachLayer((layer) => { if (layer instanceof L.Marker) map.removeLayer(layer); });

                const res = await fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${currentArea}.json`);
                const forecastData = await res.json();

                const areas = forecastData[0].timeSeries[0].areas;
                const pops = forecastData[0].timeSeries[1] ? forecastData[0].timeSeries[1].areas : [];
                const temps = forecastData[0].timeSeries[2] ? forecastData[0].timeSeries[2].areas : [];

                const config = regionalCoordinates[currentArea] || areas.map((a, i) => {
                    const center = map.getCenter();
                    return { name: a.area.name, lat: center.lat + (i * 0.15), lon: center.lng + (i * 0.15) };
                });

                config.forEach((pos) => {
                    const fArea = areas.find(a => a.area.name.includes(pos.name)) || areas[0];
                    const pArea = pops.find(a => a.area.name.includes(pos.name)) || pops[0];
                    const tArea = temps.find(a => a.area.name.includes(pos.name)) || temps[0];

                    const wObj = getWeatherStyles(fArea.weatherCodes[0]);
                    const popValue = pArea ? (pArea.pops[0] || '0') : '0';
                    const maxTemp = tArea ? (tArea.temps[0] || '--') : '--';
                    const minTemp = tArea ? (tArea.temps[1] || '--') : '--';

                    const customHtml = `
                        <div class="map-pin-card">
                            <div class="pin-name">${pos.name}</div>
                            <div class="weather-box ${wObj.class}">${wObj.emoji}</div>
                            <div class="pin-temps"><span class="max">${maxTemp}</span> / <span class="min">${minTemp}</span></div>
                            <div class="pin-pop">${popValue}%</div>
                        </div>
                    `;

                    const customIcon = L.divIcon({ html: customHtml, iconSize: [160, 140], iconAnchor: [80, 70] });
                    L.marker([pos.lat, pos.lon], { icon: customIcon }).addTo(map);
                });
            } catch(e) { console.error(e); }

            // アメダス最新気温
            try {
                const tRes = await fetch(`https://www.jma.go.jp/bosai/amedas/data/latest_time.txt`);
                const rawTime = (await tRes.text()).trim().replace(/\D/g, '');
                const year = rawTime.substring(0, 4); const month = rawTime.substring(4, 6); const day = rawTime.substring(6, 8);
                const hour24 = parseInt(rawTime.substring(8, 10));
                const utcDate = new Date(new Date(year, parseInt(month)-1, day, hour24).getTime() - (9 * 60 * 60 * 1000));
                
                const utcHour = utcDate.getHours();
                let fileHour = "00";
                if (utcHour >= 0 && utcHour <= 2) fileHour = "03";
                else if (utcHour >= 3 && utcHour <= 5) fileHour = "06";
                else if (utcHour >= 6 && utcHour <= 8) fileHour = "09";
                else if (utcHour >= 9 && utcHour <= 11) fileHour = "12";
                else if (utcHour >= 12 && utcHour <= 14) fileHour = "15";
                else if (utcHour >= 15 && utcHour <= 17) fileHour = "18";
                else if (utcHour >= 18 && utcHour <= 20) fileHour = "21";
                else fileHour = "00";

                const targetUrl = `https://www.jma.go.jp/bosai/amedas/data/point/${currentAmedas}/${year}${month}${day}_${fileHour}.json`;
                const amedasRes = await fetch(targetUrl);
                if (amedasRes.ok) {
                    const amedasData = await amedasRes.json();
                    const keys = Object.keys(amedasData).sort();
                    let finalTemp = null;
                    for (let i = keys.length - 1; i >= 0; i--) {
                        if (amedasData[keys[i]].temp && amedasData[keys[i]].temp[0] !== null) { finalTemp = amedasData[keys[i]].temp[0]; break; }
                    }
                    if (finalTemp !== null) document.getElementById('liveTemp').innerText = finalTemp.toFixed(1) + '°C';
                }
            } catch(e) { console.error(e); }
        }

        initMap();
        initSystem();
        setInterval(initSystem, 120000);
    </script>
</body>
</html>
