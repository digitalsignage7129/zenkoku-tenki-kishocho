<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>WEATHER MAP SIGNAGE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Hiragino Kaku Gothic StdN", "Meiryo", Arial, sans-serif;
            font-weight: bold;
            padding: 25px;
            overflow: hidden;
            height: 100vh;
        }
        
        /* 固定ヘッダー */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 6px solid #ffffff;
            padding-bottom: 15px;
            position: relative;
            z-index: 10; /* 地図より前に出す */
        }
        .date { font-size: 55px; font-family: monospace; color: #aaaaaa; }
        .name { font-size: 70px; color: #ffffff; font-weight: 900; line-height: 1.1; margin-left: 15px; }
        .temp-area { font-size: 35px; color: #ffffff; background: #333333; padding: 4px 12px; border-radius: 8px; }
        .temp-display { font-size: 110px; color: #00ffcc; font-family: 'Arial Black', sans-serif; line-height: 0.9; margin-left: 15px; }

        /* 地図を配置するベース（画面いっぱいに広げる） */
        .map-viewport {
            position: relative;
            width: 100%;
            height: calc(100vh - 200px);
            margin-top: 20px;
            background: #050505; /* ほんのり明るい黒 */
            border-radius: 20px;
            overflow: hidden;
        }

        /* 背景の簡易地図シルエット（CSSの図形で東京の形をそれっぽく表現、後に自動SVG化） */
        .map-bg-silhouette {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 60%;
            background: linear-gradient(135deg, #112211 0%, #051105 100%); /* 焼き付けない暗い緑 */
            border: 3px dashed #224422;
            border-radius: 50% 30% 40% 20%;
            opacity: 0.7;
        }

        /* 送っていただいた画像を再現した「地図上に浮かぶ予報カード」 */
        .map-pin-card {
            position: absolute;
            background: rgba(17, 17, 17, 0.9); /* 高級感のある半透明の黒 */
            border: 4px solid #ffffff;
            border-radius: 12px;
            width: 210px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .pin-name {
            font-size: 32px;
            color: #ffffff;
            border-bottom: 2px solid #555555;
            width: 100%;
            text-align: center;
            padding-bottom: 2px;
            background: #222222;
            border-radius: 6px 6px 0 0;
        }

        .pin-weather {
            font-size: 75px;
            line-height: 1;
            margin: 5px 0;
        }

        .pin-temps {
            font-size: 28px;
            font-family: monospace;
        }
        .max { color: #ff4444; }
        .min { color: #4488ff; }

        .pin-pop {
            font-size: 35px;
            color: #ffff00;
            font-family: "Impact", sans-serif;
            margin-top: 2px;
        }

        /* 各地域の位置（東京の地理的配置をシミュレート） */
        #pin-okutama { top: 15%; left: 10%; }  /* 左上の奥多摩 */
        #pin-ome     { top: 25%; left: 30%; }  /* 青梅 */
        #pin-hachioji { top: 55%; left: 25%; }  /* 左下の八王子 */
        #pin-tachikawa { top: 35%; left: 45%; } /* 中央の立川 */
        #pin-shinjuku  { top: 40%; left: 68%; } /* 都心近くの新宿 */
        #pin-tokyo     { top: 45%; left: 83%; } /* 右側の東京 */
    </style>
</head>
<body>

    <div class="header">
        <div>
            <span class="date">6/1</span>
            <span class="name">東京都</span>
        </div>
        <div>
            <span class="temp-area">現在気温</span>
            <span class="temp-display">26.5°C</span>
        </div>
    </div>

    <div class="map-viewport">
        <div class="map-bg-silhouette"></div>

        <div class="map-pin-card" id="pin-okutama">
            <span class="pin-name">奥多摩</span>
            <span class="pin-weather">☀</span>
            <div class="pin-temps"><span class="max">30</span>/<span class="min">14</span></div>
            <span class="pin-pop">20%</span>
        </div>

        <div class="map-pin-card" id="pin-ome">
            <span class="pin-name">青梅</span>
            <span class="pin-weather">☀</span>
            <div class="pin-temps"><span class="max">32</span>/<span class="min">16</span></div>
            <span class="pin-pop">20%</span>
        </div>

        <div class="map-pin-card" id="pin-hachioji">
            <span class="pin-name">八王子</span>
            <span class="pin-weather">☀</span>
            <div class="pin-temps"><span class="max">32</span>/<span class="min">16</span></div>
            <span class="pin-pop">20%</span>
        </div>

        <div class="map-pin-card" id="pin-tachikawa">
            <span class="pin-name">立川</span>
            <span class="pin-weather">☀</span>
            <div class="pin-temps"><span class="max">32</span>/<span class="min">17</span></div>
            <span class="pin-pop">20%</span>
        </div>

        <div class="map-pin-card" id="pin-shinjuku">
            <span class="pin-name">新宿</span>
            <span class="pin-weather">☀</span>
            <div class="pin-temps"><span class="max">31</span>/<span class="min">19</span></div>
            <span class="pin-pop">20%</span>
        </div>

        <div class="map-pin-card" id="pin-tokyo">
            <span class="pin-name">東京</span>
            <span class="pin-weather">☀</span>
            <div class="pin-temps"><span class="max">31</span>/<span class="min">20</span></div>
            <span class="pin-pop">20%</span>
        </div>
    </div>

</body>
</html>
