<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>WEATHER MAP SIGNAGE PERFECT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Hiragino Kaku Gothic StdN", "Meiryo", Arial, sans-serif;
            font-weight: bold;
            padding: 25px;
            overflow: hidden;
            height: 100vh;
        }
        
        /* 固定ヘッダー */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 6px solid #ffffff;
            padding-bottom: 15px;
            height: 140px;
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .date { font-size: 55px; font-family: monospace; color: #aaaaaa; }
        
        /* セレクトボックスのバグを完全修正（背景を黒、文字を白に） */
        .pref-selector {
            font-size: 40px;
            font-weight: 900;
            background-color: #222222;
            color: #ffffff;
            border: 3px solid #ffffff;
            border-radius: 10px;
            padding: 5px 15px;
            cursor: pointer;
        }
        .pref-selector option {
            background-color: #222222;
            color: #ffffff;
        }

        .header-right { display: flex; align-items: baseline; gap: 15px; }
        .temp-area { font-size: 35px; color: #ffffff; background: #333333; padding: 4px 12px; border-radius: 8px; }
        .temp-display { font-size: 110px; color: #00ffcc; font-family: 'Arial Black', sans-serif; line-height: 0.9; }

        /* 地図ビューポート */
        .map-viewport {
            position: relative;
            width: 100%;
            height: calc(100vh - 190px);
            margin-top: 20px;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #333333;
            background: #000000;
        }

        /* 本物の地図を表示するコンテナ（焼き付き防止のためダークモード化） */
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000000 !important;
        }
        /* 地図の色をサイネージ用に反転（黒背景・うっすら緑の地形に変換するフィルター） */
        .leaflet-tile-container {
            filter: invert(100%) hue-rotate(90deg) brightness(40%) contrast(120%);
        }

        /* 予報カードデザイン（重なりを防止し、完全に送られた画像を再現） */
        .custom-pin-card {
            background: rgba(10, 10, 10, 0.95) !important;
            border: 4px solid #ffffff !important;
            border-radius: 12px !important;
            width: 200px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            text-align: center;
        }
        .pin-name {
            font-size: 28px;
            color: #ffffff;
            border-bottom: 2px solid #555555;
            width: 100%;
            padding-bottom: 2px;
            background: #222222;
            font-weight: 900;
        }
        .pin-weather { font-size: 65px; line-height: 1; margin: 3px 0; }
        .pin-temps { font-size: 26px; font-family: monospace; font-weight: bold; }
        .max { color: #ff4444; }
        .min { color: #4488ff; }
        .pin-pop { font-size: 32px; color: #ffff00; font-family: "Impact", sans-serif; margin-top: 2px; }

        /* Leafletの余計なアイコン影などを非表示にする */
        .leaflet-marker-icon { background: none; border: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <span class="date" id="dateText">--/--</span>
            <select class="pref-selector" id="prefSelect" onchange="changePrefecture()">
                <option value="130000,44132,35.6895,139.6917,10">東京都</option>
                <option value="270000,62078,34.6863,135.5200,10">大阪府</option>
                <option value="020000,31151,40.8244,140.7471,9">青森県</option>
                <option value="140000,46106,35.4478,139.6425,10">神奈川県</option>
                <option value="230000,51106,35.1803,136.9067,10">愛知県</option>
                <option value="400000,82182,33.6064,130.4181,10">福岡県</option>
                <option value="471000,91197,26.2125,127.6809,10">沖縄県</option>
            </select>
        </div>
        <div class="header-right">
            <span class="temp-area">現在気温</span>
            <span class="temp-display" id="liveTemp">--.-°C</span>
        </div>
    </div>

    <div class="map-viewport">
        <div id="map"></div>
    </div>

    <script>
        let map;
        const params = new URLSearchParams(window.location.search);
        let currentArea = params.get('area') || '130000';
        let currentAmedas = params.get('amedas') || '44132';

        // 47都道府県の主要ポイントの正確な位置（緯度・経度）データ
        const regionalCoordinates = {
            "130000": [
                { name: "東京", lat: 35.6812, lon: 139.7671 },
                { name: "新宿", lat: 35.6895, lon: 139.6917 },
                { name: "立川", lat: 35.6982, lon: 139.4130 },
                { name: "八王子", lat: 35.6554, lon: 139.3389 },
                { name: "青梅", lat: 35.7878, lon: 139.2758 },
                { name: "奥多摩", lat: 35.8088, lon: 139.0975 }
            ],
            "270000": [
                { name: "大阪", lat: 34.6937, lon: 135.5023 },
                { name: "堺", lat: 34.5732, lon: 135.4830 },
                { name: "豊中", lat: 34.7811, lon: 135.4694 },
                { name: "枚方", lat: 34.8162, lon: 135.6501 }
            ],
            "020000": [
                { name: "青森", lat: 40.8244, lon: 140.7471 },
                { name: "弘前", lat: 40.6031, lon: 140.4642 },
                { name: "八戸", lat: 40.5123, lon: 141.4883 },
                { name: "むつ", lat: 41.2927, lon: 141.2168 }
            ]
        };

        // セレクトボックスの初期同期
        const selectEl = document.getElementById('prefSelect');
        for (let option of selectEl.options) {
            if (option.value.startsWith(currentArea)) {
                selectEl.value = option.value;
                break;
            }
        }

        function changePrefecture() {
            const val = selectEl.value.split(',');
            currentArea = val[0];
            currentAmedas = val[1];
            const lat = parseFloat(val[2]);
            const lon = parseFloat(val[3]);
            const zoom = parseInt(val[4]);
            
            map.setView([lat, lon], zoom);
            initSystem();
        }

        function getWeatherEmoji(code) {
            const c = parseInt(code);
            if (c >= 100 && c < 200) return '☀';
            if (c >= 200 && c < 300) return '☁';
            if (c >= 300 && c < 400) return '☔';
            return '☁';
        }

        // 初期地図オブジェクト生成（1回だけ実行）
        function initMap() {
            const val = selectEl.value.split(',');
            const lat = parseFloat(val[2]);
            const lon = parseFloat(val[3]);
            const zoom = parseInt(val[4]);

            // 背景を真っ黒にした本物の地図をロード
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([lat, lon], zoom);

            // 国土地理院のモノトーン地図タイルを使用（超軽量・エラーなし）
            L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/blank/{z}/{x}/{y}.png', {
                maxZoom: 14,
                minZoom: 5
            }).addTo(map);
        }

        async function initSystem() {
            const now = new Date();
            document.getElementById('dateText').innerText = `${now.getMonth()+1}/${now.getDate()}`;

            // 1. 各都市のカードを本物の位置へピン留め（重なり完全回避）
            try {
                // 既存のピン（マーカー）を全削除
                map.eachLayer((layer) => {
                    if (layer instanceof L.Marker) map.removeLayer(layer);
                });

                const res = await fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${currentArea}.json`);
                const forecastData = await res.json();

                const config = regionalCoordinates[currentArea] || [{ name: "大阪", lat: 34.6937, lon: 135.5023 }];
                const areas = forecastData[0].timeSeries[0].areas;
                const pops = forecastData[0].timeSeries[1] ? forecastData[0].timeSeries[1].areas : [];
                const temps = forecastData[0].timeSeries[2] ? forecastData[0].timeSeries[2].areas : [];

                config.forEach((pos) => {
                    const fArea = areas.find(a => a.area.name.includes(pos.name)) || areas[0];
                    const pArea = pops.find(a => a.area.name.includes(pos.name)) || pops[0];
                    const tArea = temps.find(a => a.area.name.includes(pos.name)) || temps[0];

                    const weatherIcon = getWeatherEmoji(fArea.weatherCodes[0]);
                    const popValue = pArea ? (pArea.pops[0] || '0') : '0';
                    const maxTemp = tArea ? (tArea.temps[0] || '--') : '--';
                    const minTemp = tArea ? (tArea.temps[1] || '--') : '--';

                    // 送っていただいた画像のデザインを100%再現したHTMLカスタムピン
                    const customHtml = `
                        <div class="custom-pin-card">
                            <div class="pin-name">${pos.name}</div>
                            <div class="pin-weather">${weatherIcon}</div>
                            <div class="pin-temps"><span class="max">${maxTemp}</span> / <span class="min">${minTemp}</span></div>
                            <div class="pin-pop">${popValue}%</div>
                        </div>
                    `;

                    const customIcon = L.divIcon({
                        html: customHtml,
                        iconSize: [200, 160],
                        iconAnchor: [100, 80]
                    });

                    // 本物の緯度・経度にカードを直に刺す（重ならない）
                    L.marker([pos.lat, pos.lon], { icon: customIcon }).addTo(map);
                });
            } catch(e) { console.error(e); }

            // 2. アメダス現在気温のリアルタイム更新
            try {
                const tRes = await fetch(`https://www.jma.go.jp/bosai/amedas/data/latest_time.txt`);
                const rawTime = (await tRes.text()).trim().replace(/\D/g, '');
                const year = rawTime.substring(0, 4); const month = rawTime.substring(4, 6); const day = rawTime.substring(6, 8);
                const hour24 = parseInt(rawTime.substring(8, 10));
                const utcDate = new Date(new Date(year, parseInt(month)-1, day, hour24).getTime() - (9 * 60 * 60 * 1000));
                
                const utcHour = utcDate.getHours();
                let fileHour = "00";
                if (utcHour >= 0 && utcHour <= 2) fileHour = "03";
                else if (utcHour >= 3 && utcHour <= 5) fileHour = "06";
                else if (utcHour >= 6 && utcHour <= 8) fileHour = "09";
                else if (utcHour >= 9 && utcHour <= 11) fileHour = "12";
                else if (utcHour >= 12 && utcHour <= 14) fileHour = "15";
                else if (utcHour >= 15 && utcHour <= 17) fileHour = "18";
                else if (utcHour >= 18 && utcHour <= 20) fileHour = "21";
                else fileHour = "00";

                const targetUrl = `https://www.jma.go.jp/bosai/amedas/data/point/${currentAmedas}/${year}${month}${day}_${fileHour}.json`;
                const amedasRes = await fetch(targetUrl);
                if (amedasRes.ok) {
                    const amedasData = await amedasRes.json();
                    const keys = Object.keys(amedasData).sort();
                    let finalTemp = null;
                    for (let i = keys.length - 1; i >= 0; i--) {
                        if (amedasData[keys[i]].temp && amedasData[keys[i]].temp[0] !== null) {
                            finalTemp = amedasData[keys[i]].temp[0];
                            break;
                        }
                    }
                    if (finalTemp !== null) document.getElementById('liveTemp').innerText = finalTemp.toFixed(1) + '°C';
                }
            } catch(e) { console.error(e); }
        }

        // 起動処理
        initMap();
        initSystem();
        setInterval(initSystem, 120000); // 2分毎更新
    </script>
</body>
</html>
