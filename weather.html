<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>WEATHER BOARD FLEX</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Hiragino Kaku Gothic StdN", "Meiryo", Arial, sans-serif;
            font-weight: bold;
            padding: 25px;
            overflow: hidden;
            height: 100vh;
        }
        /* ヘッダー部分は固定 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 5px solid #ffffff;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        .date { font-size: 50px; font-family: monospace; }
        .name { font-size: 55px; color: #ffffff; font-weight: 900; margin-left: 20px; }
        .temp-area { font-size: 28px; color: #aaaaaa; }
        .temp-display { font-size: 75px; color: #00ffcc; font-family: 'Arial Black', sans-serif; margin-left: 10px; }

        /* 3時間ごとの横並びコンテナ */
        .timeline-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            height: calc(100vh - 180px);
        }
        .time-box {
            flex: 1;
            background: #111111;
            border: 4px solid #333333;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 20px 10px;
        }
        .time-label { font-size: 35px; color: #ffff00; font-family: monospace; }
        .time-icon { font-size: 90px; line-height: 1; }
        .time-temp { font-size: 45px; color: #ffffff; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <span class="date">6/1</span>
            <span class="name" id="backName">青森</span>
        </div>
        <div>
            <span class="temp-area">現在気温</span>
            <span class="temp-display">--.-°C</span>
        </div>
    </div>

    <!-- ここに3時間ごとのデータが横並びで入るイメージです -->
    <div class="timeline-container">
        <div class="time-box">
            <span class="time-label">15:00</span>
            <span class="time-icon">☀</span>
            <span class="time-temp">24°C</span>
        </div>
        <div class="time-box">
            <span class="time-label">18:00</span>
            <span class="time-icon">☁</span>
            <span class="time-temp">21°C</span>
        </div>
        <div class="time-box">
            <span class="time-label">21:00</span>
            <span class="time-icon">☔</span>
            <span class="time-temp">18°C</span>
        </div>
        <div class="time-box">
            <span class="time-label">00:00</span>
            <span class="time-icon">☁</span>
            <span class="time-temp">16°C</span>
        </div>
    </div>

</body>
</html>
