<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天気サイネージ・コントロールセンター</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", sans-serif; padding: 30px 15px; max-width: 700px; margin: 0 auto; }
        h1 { text-align: center; color: #00ffcc; font-size: 1.6rem; margin-bottom: 25px; }
        .control-panel { background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333; }
        label { display: block; margin-bottom: 10px; font-weight: bold; color: #ffffff; }
        select { width: 100%; padding: 14px; font-size: 16px; border-radius: 8px; background: #2a2a2a; color: #fff; border: 1px solid #444; margin-bottom: 25px; cursor: pointer; }
        .btn-container { display: flex; gap: 15px; }
        button { flex: 1; padding: 18px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-main { background: #00ffcc; color: #000; }
        .btn-mini { background: #ffff00; color: #000; }
        .note { margin-top: 15px; font-size: 12px; color: #888; text-align: center; }
    </style>
</head>

        <div class="btn-container">
            <button class="btn-main" onclick="launch('weather.html')">通常版（大）を起動</button>
            <button class="btn-mini" onclick="launch('mini_weather.html')">ミニ版（小）を起動</button>
        </div>
    </div>
    <div class="note">※起動後、LEDサイネージ用ブラウザの表示サイズに適合します。</div>
    <script>
        function launch(targetPage) {
            const select = document.getElementById('areaSelect');
            const area = select.value;
            const amedas = select.options[select.selectedIndex].getAttribute('data-amedas');
            const rawName = select.options[select.selectedIndex].text;
            const name = rawName.split(' (')[0].replace('北海道 ', '').replace('県', '').replace('府', '');
            window.location.href = `${targetPage}?area=${area}&amedas=${amedas}&name=${encodeURIComponent(name)}`;
        }
    </script>
</body>
</html>
