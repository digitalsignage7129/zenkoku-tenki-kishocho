<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>天気サイネージ管理画面</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 50px; text-align: center; }
        select, button { font-size: 24px; padding: 10px 20px; margin: 10px; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>デジタルサイネージ天気設定</h1>
    <form action="weather.html" method="get">
        <select name="area">
            <option value="130000">東京都</option>
            <option value="020000">青森県</option>
            <option value="270000">大阪府</option>
        </select>
        <input type="hidden" name="amedas" value="44132">
        <input type="hidden" name="name" value="天気ボード">
        <br><br>
        <button type="submit">サイネージ画面を開く</button>
    </form>
</body>
</html>
