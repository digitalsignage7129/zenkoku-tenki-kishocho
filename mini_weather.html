<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>WEATHER BOARD MINI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Impact", "Arial Black", "Hiragino Kaku Gothic StdN", sans-serif;
            font-weight: 900;
            width: 525px;
            height: 610px;
            overflow: hidden;
            position: relative;
        }

        /* 上部日付バー */
        .header {
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            background: #000000;
        }
        .header-date { font-size: 42px; color: #ffffff; font-family: monospace; }
        .header-name { font-size: 38px; color: #ffffff; font-weight: 900; }
        .header-temp { font-size: 52px; color: #00ffcc; font-family: 'Arial Black', sans-serif; }

        /* 今日（午前・午後・夜間）3連ゾーン */
        .today-box {
            height: 385px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2px 0;
        }
        .time-row {
            height: 124px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }
        .time-label { font-size: 44px; color: #ffffff; width: 100px; text-align: left; }
        .weather-icon { font-size: 82px; width: 130px; text-align: center; line-height: 1; }
        .pop-val { font-size: 110px; color: #ffff00; font-family: "Impact", sans-serif; width: 180px; text-align: right; }

        /* 明日・明後日ゾーン */
        .future-box {
            height: 160px;
            display: flex;
            background: #000000;
        }
        .day-col {
            width: 50%;
            height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .day-label { font-size: 32px; color: #ffffff; margin-bottom: -5px; }
        .day-flex { display: flex; align-items: center; justify-content: center; width: 100%; gap: 5px; }
        .future-icon { font-size: 65px; }
        .future-pop { font-size: 75px; color: #ffff00; font-family: "Impact", sans-serif; }

        /* クレジット（極小サイズ） */
        .credit {
            position: absolute;
            bottom: 2px;
            right: 8px;
            font-size: 12px;
            color: #555555;
            font-family: sans-serif;
            font-weight: normal;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="header-date" id="dateText">--/--</span>
        <span class="header-name" id="backName">--</span>
        <span class="header-temp" id="liveTemp">--</span>
    </div>

    <div class="today-box">
        <div class="time-row">
            <span class="time-label">午前</span>
            <span class="weather-icon" id="iconAm">・</span>
            <span class="pop-val" id="popAm">--</span>
        </div>
        <div class="time-row">
            <span class="time-label">午後</span>
            <span class="weather-icon" id="iconPm">・</span>
            <span class="pop-val" id="popPm">--</span>
        </div>
        <div class="time-row">
            <span class="time-label">夜間</span>
            <span class="weather-icon" id="iconNight">・</span>
            <span class="pop-val" id="popNight">--</span>
        </div>
    </div>

    <div class="future-box">
        <div class="day-col">
            <span class="day-label">明日</span>
            <div class="day-flex">
                <span class="weather-icon future-icon" id="iconTom">・</span>
                <span class="future-pop" id="popTom">--</span>
            </div>
        </div>
        <div class="day-col">
            <span class="day-label">明後日</span>
            <div class="day-flex">
                <span class="weather-icon future-icon" id="iconAftTom">・</span>
                <span class="future-pop" id="popAftTom">--</span>
            </div>
        </div>
    </div>

    <div class="credit">データ元: 気象庁</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const areaCode = params.get('area') || '130000'; 
        const amedasCode = params.get('amedas') || '44132';
        const areaName = params.get('name') || '東京';

        document.getElementById('backName').innerText = areaName;

        function debugLog(ctx, status) {
            console.log(`[WeatherSystem Debug] ${new Date().toLocaleTimeString()} | ${ctx} -> ${status}`);
        }

        function getWeatherEmoji(code) {
            const c = parseInt(code);
            if (isNaN(c)) return '☁';
            if ([100, 101, 123, 130, 131, 140, 181].includes(c)) return '☀';
            if ([200, 201, 209, 231, 240, 281].includes(c)) return '☁';
            if ([300, 301, 302, 303, 308, 309, 311, 313, 314, 315, 340, 350].includes(c)) return '☔';
            if ([400, 401, 402, 403, 405, 409, 430, 450].includes(c)) return '❄';
            if (c >= 100 && c < 200) return '☀';
            if (c >= 200 && c < 300) return '☁';
            if (c >= 300 && c < 400) return '☔';
            return '☁';
        }

        function updateDate() {
            const now = new Date();
            document.getElementById('dateText').innerText = `${now.getMonth() + 1}/${now.getDate()}`;
        }

        async function fetchForecast() {
            debugLog("府県天気予報API", "通信開始");
            try {
                const response = await fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${areaCode}.json`);
                if (!response.ok) throw new Error(`HTTP status ${response.status}`);
                const data = await response.json();
                debugLog("府県天気予報API", "パース成功");

                // 3時間おきの詳細データ用オブジェクト抽出
                const timeSeriesData = data[0].timeSeries;
                
                // 1. 今日の「午前(9時)」「午後(15時)」「夜間(21時)」のマッピング
                let popAm = '--', popPm = '--', popNight = '--';
                let codeAm = null, codePm = null, codeNight = null;

                // 天気コード系列のパース (timeSeries[0])
                const weatherArea = timeSeriesData[0].areas[0];
                const weatherTimes = timeSeriesData[0].timeSeries;
                const weatherCodes = weatherArea.weatherCodes;

                // 降水確率系列のパース (timeSeries[1])
                const popArea = timeSeriesData[1].areas[0];
                const popTimes = timeSeriesData[1].timeSeries;
                const popValues = popArea.pops;

                // 今日の日付文字列
                const todayStr = new Date().getDate();

                // 3時間推移（予報時間軸）を精査して各インデックスへ落とし込む
                if (popTimes && popValues) {
                    popTimes.forEach((tStr, idx) => {
                        const targetDate = new Date(tStr);
                        if (targetDate.getDate() === todayStr) {
                            const hr = targetDate.getHours();
                            if (hr >= 6 && hr < 12)  popAm = popValues[idx];
                            if (hr >= 12 && hr < 18) popPm = popValues[idx];
                            if (hr >= 18 && hr < 24) popNight = popValues[idx];
                        }
                    });
                }

                // 規定のコード値マッピング (なければ代表天気で埋める)
                codeAm = weatherCodes[0];
                codePm = weatherCodes[0];
                codeNight = weatherCodes[0];

                document.getElementById('iconAm').innerText = getWeatherEmoji(codeAm);
                document.getElementById('iconPm').innerText = getWeatherEmoji(codePm);
                document.getElementById('iconNight').innerText = getWeatherEmoji(codeNight);

                document.getElementById('popAm').innerText = popAm;
                document.getElementById('popPm').innerText = popPm;
                document.getElementById('popNight').innerText = popNight;

                // 2. 明日のデータ処理
                document.getElementById('iconTom').innerText = getWeatherEmoji(weatherCodes[1]);
                let tomPops = [];
                const tomorrowStr = new Date(Date.now() + 86400000).getDate();
                if (popTimes && popValues) {
                    popTimes.forEach((tStr, idx) => {
                        if (new Date(tStr).getDate() === tomorrowStr) {
                            tomPops.push(parseInt(popValues[idx] || 0));
                        }
                    });
                }
                document.getElementById('popTom').innerText = tomPops.length > 0 ? Math.max(...tomPops) : (popValues[1] || '0');

                // 3. 明後日（3日目）のエラー回避・最大値ロジック (data[1]の週間予報から確実に参照)
                try {
                    const weekTimeSeries = data[1].timeSeries;
                    const weekWeatherCodes = weekTimeSeries[0].areas[0].weatherCodes;
                    // 週間予報配列のインデックス[1]が明後日に該当
                    document.getElementById('iconAftTom').innerText = getWeatherEmoji(weekWeatherCodes[1]);

                    const weekPops = weekTimeSeries[1].areas[0].pops;
                    // 明後日の降水確率(インデックス[1])が存在すれば表示
                    document.getElementById('popAftTom').innerText = weekPops[1] !== undefined ? weekPops[1] : '--';
                    debugLog("明後日(3日目)データ", "正常処理完了");
                } catch (weekErr) {
                    debugLog("明後日データ抽出", "フォールバック実行");
                    document.getElementById('iconAftTom').innerText = getWeatherEmoji(weatherCodes[2] || '200');
                    document.getElementById('popAftTom').innerText = '0';
                }

            } catch (err) {
                debugLog("府県天気予報API", `エラー: ${err.message}`);
            }
        }

        async function fetchAmedas() {
            debugLog("アメダス実況API", "現在時刻キーの確認開始");
            try {
                const resTime = await fetch('https://www.jma.go.jp/bosai/amedas/data/latest_time.txt');
                const latestTime = (await resTime.text()).trim();
                
                const year = latestTime.substring(0, 4);
                const month = latestTime.substring(4, 6);
                const day = latestTime.substring(6, 8);
                const hour = latestTime.substring(8, 10);

                // アメダス1時間ブロックのファイルを取得
                const amedasUrl = `https://www.jma.go.jp/bosai/amedas/data/point/${amedasCode}/${year}${month}${day}_${hour}.json`;
                const resData = await fetch(amedasUrl);
                if (!resData.ok) throw new Error("アメダスJSONのダウンロードに失敗");
                const amedasJson = await resData.json();

                // 与えられた最新タイムスタンプから10分刻みのキーを作成し、データが存在するかチェック
                let timeKey = `${latestTime}00`;
                let pointData = amedasJson[timeKey];

                // 気象庁サーバー側での反映遅延によるヌルポインタ対策：最新キーがなければ、10分前、20分前のデータを順次サーチする
                if (!pointData || !pointData.temp) {
                    const baseMin = parseInt(latestTime.substring(10, 12));
                    for (let offset = 10; offset <= 30; offset += 10) {
                        let checkMin = baseMin - offset;
                        let checkHour = parseInt(hour);
                        if (checkMin < 0) {
                            checkMin += 60;
                            checkHour = (checkHour - 1 + 24) % 24;
                        }
                        const testKey = `${year}${month}${day}${String(checkHour).padStart(2, '0')}${String(checkMin).padStart(2, '0')}00`;
                        if (amedasJson[testKey] && amedasJson[testKey].temp) {
                            pointData = amedasJson[testKey];
                            break;
                        }
                    }
                }

                if (pointData && pointData.temp) {
                    const tempVal = pointData.temp[0];
                    // 小数第一位まで丸めて表示（サイン記号等は不要、数値のみ）
                    document.getElementById('liveTemp').innerText = `${tempVal.toFixed(1)}`;
                    debugLog("現在気温データ更新", `成功: ${tempVal}度`);
                } else {
                    document.getElementById('liveTemp').innerText = "--";
                    debugLog("アメダス気温データ", "指定時間帯に有効値なし");
                }

            } catch (err) {
                document.getElementById('liveTemp').innerText = "--";
                debugLog("アメダス実況API", `エラー: ${err.message}`);
            }
        }

        // 初期実行とインターバルタイマー設定
        updateDate();
        fetchForecast();
        fetchAmedas();

        setInterval(updateDate, 30000);
        setInterval(fetchAmedas, 300000);   // 5分毎にアメダスを再検証
        setInterval(fetchForecast, 1800000); // 30分毎に予報を更新
    </script>
</body>
</html>
