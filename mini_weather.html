<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>WEATHER BOARD MINI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Impact", "Arial Black", "Hiragino Kaku Gothic StdN", sans-serif;
            font-weight: 900;
            width: 525px;
            height: 610px;
            overflow: hidden;
            position: relative;
        }
        .header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            background: #000000;
            border-bottom: 3px solid #ffffff;
        }
        .header-date { font-size: 38px; color: #ffffff; font-family: monospace; }
        .center-group { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .header-name { font-size: 36px; color: #ffffff; font-weight: 900; line-height: 1.1; }
        .credit-tag { font-size: 11px; color: #aaaaaa; font-family: sans-serif; font-weight: normal; }
        .header-temp { font-size: 52px; color: #00ffcc; font-family: 'Arial Black', sans-serif; }

        .today-box { height: 380px; display: flex; flex-direction: column; justify-content: space-between; padding: 5px 0; }
        .time-row { height: 120px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        .time-label { font-size: 44px; color: #ffffff; width: 100px; }
        .weather-icon { font-size: 85px; width: 130px; text-align: center; line-height: 1; }
        
        .pop-wrapper { width: 200px; text-align: right; color: #ffff00; font-family: "Impact", sans-serif; }
        .pop-val { font-size: 110px; line-height: 1; }
        .pop-unit { font-size: 45px; margin-left: -5px; vertical-align: super; font-weight: 900; }

        .future-box { height: 160px; display: flex; background: #000000; border-top: 3px solid #ffffff; }
        .day-col { width: 50%; height: 155px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .day-col:first-child { border-right: 2px solid #ffffff; }
        .day-label { font-size: 32px; color: #ffffff; margin-bottom: -2px; }
        .day-flex { display: flex; align-items: center; justify-content: center; width: 100%; gap: 2px; }
        .future-icon { font-size: 65px; }
        .future-pop { font-size: 70px; color: #ffff00; font-family: "Impact", sans-serif; line-height: 1; }
        .future-unit { font-size: 30px; color: #ffff00; font-weight: 900; vertical-align: super; }
    </style>
</head>
<body>

    <div class="header">
        <span class="header-date" id="dateText">--/--</span>
        <div class="center-group">
            <span class="header-name" id="backName">--</span>
            <span class="credit-tag">データ元:気象庁</span>
        </div>
        <span class="header-temp" id="liveTemp">--.-</span>
    </div>

    <div class="today-box">
        <div class="time-row">
            <span class="time-label">午前</span>
            <span class="weather-icon" id="iconAm">・</span>
            <div class="pop-wrapper"><span class="pop-val" id="popAm">--</span><span class="pop-unit">%</span></div>
        </div>
        <div class="time-row">
            <span class="time-label">午後</span>
            <span class="weather-icon" id="iconPm">・</span>
            <div class="pop-wrapper"><span class="pop-val" id="popPm">--</span><span class="pop-unit">%</span></div>
        </div>
        <div class="time-row">
            <span class="time-label">夜間</span>
            <span class="weather-icon" id="iconNight">・</span>
            <div class="pop-wrapper"><span class="pop-val" id="popNight">--</span><span class="pop-unit">%</span></div>
        </div>
    </div>

    <div class="future-box">
        <div class="day-col">
            <span class="day-label">明日</span>
            <div class="day-flex">
                <span class="weather-icon future-icon" id="iconTom">・</span>
                <span class="future-pop" id="popTom">--</span><span class="future-unit">%</span>
            </div>
        </div>
        <div class="day-col">
            <span class="day-label">明後日</span>
            <div class="day-flex">
                <span class="weather-icon future-icon" id="iconAftTom">・</span>
                <span class="future-pop" id="popAftTom">--</span><span class="future-unit">%</span>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const areaCode = params.get('area') || '130000'; 
        const amedasCode = params.get('amedas') || '44132';
        const areaName = params.get('name') || '東京';

        document.getElementById('backName').innerText = areaName;

        function getWeatherEmoji(code) {
            const c = parseInt(code);
            if (isNaN(c)) return '☁';
            if ([100, 101, 123, 130, 131, 140, 181].includes(c)) return '☀';
            if ([200, 201, 209, 231, 240, 281].includes(c)) return '☁';
            if ([300, 301, 302, 303, 308, 309, 311, 313, 314, 315, 340, 350].includes(c)) return '☔';
            if ([400, 401, 402, 403, 405, 409, 430, 450].includes(c)) return '❄';
            return (c >= 100 && c < 200) ? '☀' : (c >= 300 && c < 400) ? '☔' : '☁';
        }

        async function fetchForecast() {
            try {
                const response = await fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${areaCode}.json`);
                const data = await response.json();

                const timeSeriesData = data[0].timeSeries;
                const weatherCodes = timeSeriesData[0].areas[0].weatherCodes;
                
                // 過去時間帯データ消滅対策：初期値を「0」か代表値にしておく
                let popAm = '0', popPm = '0', popNight = '0';

                const popTimes = timeSeriesData[1].timeSeries;
                const popValues = timeSeriesData[1].areas[0].pops;
                const todayStr = new Date().getDate();

                // 時系列マッピング（存在している未来のデータだけ上書きする）
                if (popTimes && popValues) {
                    popTimes.forEach((tStr, idx) => {
                        const targetDate = new Date(tStr);
                        if (targetDate.getDate() === todayStr) {
                            const hr = targetDate.getHours();
                            // 該当枠があればそのデータ、無ければ過去なので一律「0」か非表示処理
                            if (hr >= 6 && hr < 12)  popAm = popValues[idx];
                            if (hr >= 12 && hr < 18) popPm = popValues[idx];
                            if (hr >= 18 && hr < 24) popNight = popValues[idx];
                        }
                    });
                }

                document.getElementById('iconAm').innerText = getWeatherEmoji(weatherCodes[0]);
                document.getElementById('iconPm').innerText = getWeatherEmoji(weatherCodes[0]);
                document.getElementById('iconNight').innerText = getWeatherEmoji(weatherCodes[0]);

                document.getElementById('popAm').innerText = popAm;
                document.getElementById('popPm').innerText = popPm;
                document.getElementById('popNight').innerText = popNight;

                // 明日
                document.getElementById('iconTom').innerText = getWeatherEmoji(weatherCodes[1]);
                let tomPops = [];
                const tomorrowStr = new Date(Date.now() + 86400000).getDate();
                if (popTimes && popValues) {
                    popTimes.forEach((tStr, idx) => {
                        if (new Date(tStr).getDate() === tomorrowStr) {
                            tomPops.push(parseInt(popValues[idx] || 0));
                        }
                    });
                }
                document.getElementById('popTom').innerText = tomPops.length > 0 ? Math.max(...tomPops) : '0';

                // 明後日
                try {
                    const weekTimeSeries = data[1].timeSeries;
                    document.getElementById('iconAftTom').innerText = getWeatherEmoji(weekTimeSeries[0].areas[0].weatherCodes[1]);
                    document.getElementById('popAftTom').innerText = weekTimeSeries[1].areas[0].pops[1] !== undefined ? weekTimeSeries[1].areas[0].pops[1] : '0';
                } catch (weekErr) {
                    document.getElementById('iconAftTom').innerText = getWeatherEmoji(weatherCodes[2] || '200');
                    document.getElementById('popAftTom').innerText = '0';
                }
            } catch (err) { console.error(err); }
        }

        async function fetchAmedas() {
            try {
                const resTime = await fetch('https://www.jma.go.jp/bosai/amedas/data/latest_time.txt');
                const latestTime = (await resTime.text()).trim();
                
                const year = latestTime.substring(0, 4);
                const month = latestTime.substring(4, 6);
                const day = latestTime.substring(6, 8);
                const hour = latestTime.substring(8, 10);
                const minute = latestTime.substring(10, 12);

                const amedasUrl = `https://www.jma.go.jp/bosai/amedas/data/point/${amedasCode}/${year}${month}${day}_${hour}.json`;
                const resData = await fetch(amedasUrl);
                let amedasJson = resData.ok ? await resData.json() : null;

                let pointData = null;
                let currentTotalMinutes = parseInt(hour) * 60 + parseInt(minute);

                // 同時間ファイル内での10分ごとの遡り
                if (amedasJson) {
                    for (let i = 0; i < 5; i++) {
                        let targetTotal = currentTotalMinutes - (i * 10);
                        if (targetTotal < 0) break;
                        let h = String(Math.floor(targetTotal / 60)).padStart(2, '0');
                        let m = String(targetTotal % 60).padStart(2, '0');
                        let testKey = `${year}${month}${day}${h}${m}00`;

                        if (amedasJson[testKey] && amedasJson[testKey].temp && amedasJson[testKey].temp[0] !== null) {
                            pointData = amedasJson[testKey];
                            break;
                        }
                    }
                }

                // 【完全修正】同時間ファイルに無ければ、完全に1時間前の旧ファイルを読み込む
                if (!pointData) {
                    const prevHour = String((parseInt(hour) - 1 + 24) % 24).padStart(2, '0');
                    const fallbackUrl = `https://www.jma.go.jp/bosai/amedas/data/point/${amedasCode}/${year}${month}${day}_${prevHour}.json`;
                    const resFb = await fetch(fallbackUrl);
                    if (resFb.ok) {
                        const fbJson = await resFb.json();
                        const keys = Object.keys(fbJson).sort();
                        if(keys.length > 0) {
                            const lastKey = keys[keys.length - 1];
                            if(fbJson[lastKey].temp && fbJson[lastKey].temp[0] !== null) {
                                pointData = fbJson[lastKey];
                            }
                        }
                    }
                }

                if (pointData && pointData.temp) {
                    document.getElementById('liveTemp').innerText = `${pointData.temp[0].toFixed(1)}°`;
                } else {
                    document.getElementById('liveTemp').innerText = "--.-°";
                }
            } catch (err) { document.getElementById('liveTemp').innerText = "--.-°"; }
        }

        function updateDate() {
            const now = new Date();
            document.getElementById('dateText').innerText = `${now.getMonth() + 1}/${now.getDate()}`;
        }

        updateDate(); fetchForecast(); fetchAmedas();
        setInterval(updateDate, 30000);
        setInterval(fetchAmedas, 120000);
        setInterval(fetchForecast, 1800000);
    </script>
</body>
</html>
